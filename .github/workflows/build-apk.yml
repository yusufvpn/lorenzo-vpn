name: Build Lorenzo VPN APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get Flutter Packages
        run: |
          cd lorenzo_app
          flutter pub get

      - name: Configure Android Project
        run: |
          cd lorenzo_app
          echo "android.useAndroidX=true" >> android/gradle.properties
          echo "android.enableJetifier=true" >> android/gradle.properties
          cat << 'EOF' > android/app/build.gradle
plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader("UTF-8") { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty("flutter.versionCode")
if (flutterVersionCode == null) {
    flutterVersionCode = "1"
}

def flutterVersionName = localProperties.getProperty("flutter.versionName")
if (flutterVersionName == null) {
    flutterVersionName = "1.0.0"
}

android {
    namespace "com.lorenzo.vpn"
    compileSdk 35
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        applicationId "com.lorenzo.vpn"
        minSdk 23
        targetSdk 35
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug
            minifyEnabled false
            shrinkResources false
        }
    }
}

flutter {
    source "../.."
}
EOF

      - name: Build Release APK
        run: |
          cd lorenzo_app
          flutter build apk --release --android-skip-build-dependency-validation
          cp build/app/outputs/flutter-apk/app-release.apk ../LorenzoVPN.apk

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LorenzoVPN-Android-APK
          path: LorenzoVPN.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "Lorenzo VPN v1.0.0 🚀"
          body: |
            ### 👑 Lorenzo VPN - The Strict Leader (Android APK)
            
            - **نسخة أندرويد الرسمية (Release APK)**
            - **السيرفر المدمج:** Netherlands (Amsterdam) - Fast Gaming & Roblox Bypass
            - **البروتوكول:** VLESS over WebSocket (TLS Port 443)
            - **الهوية:** شخصية لورنزو مع تصميم دارك مود فخم
            
            📲 **طريقة التحميل والتثبيت:**
            1. حمل ملف `LorenzoVPN.apk` المرفق بالأسفل مباشرة على موبايلك.
            2. افتح الملف واضغط **Install** (تثبيت).
            3. افتح التطبيق واضغط على الدائرة الكبيرة للاتصال فوراً!
          files: LorenzoVPN.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
